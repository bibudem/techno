
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controlled Chaos — Generative Art</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.11/p5.min.js"></script>

  <style>
    body {
      margin: 0;
      background: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    canvas {
      display: block;
    }
  </style>
</head>

<body>
<script>
  let squares = [];
  let canvasSize = 900;

  function setup() {
    canvasSize = min(windowWidth, windowHeight, 900);
    createCanvas(canvasSize, canvasSize);

    colorMode(HSB, 360, 100, 100, 250);
    angleMode(DEGREES);
    frameRate(60);

    generateSquares();
  }

  function generateSquares() {
    squares = [];

    let resolution = 8;
    let taille = width / resolution;
    let decalage = 7;

    for (let i = 0; i < resolution; i++) {
      for (let j = 0; j < resolution; j++) {
        squares.push({
          x: i * taille + random(-decalage, decalage),
          y: j * taille + random(-decalage, decalage),
          angle: 0
        });
      }
    }
  }

  function draw() {
    background(0, 0, 100);
    vera();
  }

  function vera() {
    noStroke();
    fill(106, 97, 40);

    let taille = width / 8;
    let espace = taille * 0.05;

    for (let s of squares) {

      s.angle = random(-2, 2);

      push();

      translate(
        s.x + taille / 2,
        s.y + taille / 2
      );

      rotate(s.angle);
      rectMode(CENTER);

      rect(
        0,
        0,
        taille - 2 * espace,
        taille - 2 * espace
      );

      pop();
    }
  }

  function mousePressed() {
    generateSquares();
  }

  function windowResized() {
    canvasSize = min(windowWidth, windowHeight, 900);
    resizeCanvas(canvasSize, canvasSize);
    generateSquares();
  }
</script>
</body>
</html>
